    **招生与科研实习 · Join Us**<br>
    欢迎对大语言模型、智能体、知识图谱与多模态学习感兴趣的同学联系我，申请博士、硕士研究生或科研实习。也欢迎希望探索这些方向的本科生交流。
    可以发邮件至 [lbguo@nju.edu.cn](mailto:lbguo@nju.edu.cn)，聊聊你的学习背景、研究兴趣，以及想探索的问题；也欢迎附上简历、项目或已有工作。期待一起发现有趣的问题！
